[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loyalty-lakehouse"
version = "0.1.0"
description = "Lakehouse de fidelidade e comércio digital (dados sintéticos) com PySpark, Delta Lake e Databricks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Spark local (Linux/macOS/WSL ou CI). NÃO instale junto com databricks-connect.
local = ["pyspark==4.0.*", "delta-spark==4.0.*", "pandas>=2.2", "pyarrow>=16"]
# Execução remota no Databricks (serverless). NÃO instale junto com pyspark.
databricks = ["databricks-connect==17.3.*", "databricks-sdk>=0.60", "pandas>=2.2"]
dev = ["pytest>=8", "plotly>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spark: testes que usam uma SparkSession local em memória (sem gravar arquivos)",
    "delta_local: testes de integração com Delta Lake local (exige Linux/macOS/WSL ou HADOOP_HOME no Windows)",
    "databricks: testes de integração executados no Databricks via databricks-connect (exige login)",
]
addopts = "-ra"
